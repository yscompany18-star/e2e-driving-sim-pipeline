name: Add paper from issue
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
jobs:
  add:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'paper')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Append paper
        run: node scripts/add-paper-from-issue.mjs
      - name: Validate
        run: node scripts/validate.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json
          git diff --cached --quiet || git commit -m "논문 추가 (#${{ github.event.issue.number }})"
          git push
      - name: Close issue
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "data/papers.json에 반영했습니다. 사이트에는 1~2분 뒤 나타납니다."
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "자동 반영에 실패했습니다. 제목·https 링크·연결할 항목을 확인해 주세요. (Actions 로그 참고)"
